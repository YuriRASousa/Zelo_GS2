spring.application.name=zelo-api

# ---------------------------------------------------------------------
# Oracle. As credenciais vem de variaveis de ambiente ou do arquivo local
# config/oracle.properties (fora do git, ver oracle.properties.example).
# ---------------------------------------------------------------------
spring.config.import=optional:file:config/oracle.properties
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool pequeno: o schema de aluno tem limite baixo de sessoes, e o app
# faz consultas curtas. Conexao ociosa e devolvida depois de 2 minutos.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=zelo-oracle

# JWT emitido pela propria API (subject = id do usuario)
zelo.jwt.secret=${JWT_SECRET:troque-este-valor-em-producao-zelo-gs2-chave-hmac-256-bits}
zelo.jwt.expiration-ms=604800000

# Fotos das ocorrencias: gravadas em disco, no banco fica so o nome.
zelo.fotos.pasta=${ZELO_FOTOS:uploads}
zelo.fotos.tamanho-maximo-bytes=1500000

# Origens liberadas no CORS (Expo web e emulador). O app nativo nao manda
# cabecalho Origin, entao nao passa por esta checagem.
zelo.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8081,http://localhost:8082,http://localhost:19006,http://10.0.2.2:8081}

# JSON de entrada com a foto em base64 pode passar de 1 MB
server.tomcat.max-swallow-size=4MB
spring.servlet.multipart.max-request-size=4MB

# Respostas compactadas: lista do mapa e painel trafegam bem menores
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=8080
